services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raomeo_management_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173
      REDIS_URL: redis://redis:6379/0
      ACTIVE_JOB_ADAPTER: sidekiq
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/rails
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: ./bin/rails server -b 0.0.0.0

  sidekiq:
    build:
      context: ./backend
    env_file:
      - ./backend/.env.example
    environment:
      RAILS_ENV: development
      DATABASE_HOST: db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173
      REDIS_URL: redis://redis:6379/0
      ACTIVE_JOB_ADAPTER: sidekiq
    volumes:
      - ./backend:/rails
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: bundle exec sidekiq -C config/sidekiq.yml

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      VITE_API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
